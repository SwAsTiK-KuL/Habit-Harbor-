name: habit_harbor
description: "A comprehensive habit tracking application with beautiful UI and robust authentication."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  #dot env File
  flutter_dotenv: ^6.0.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  bloc: ^8.1.2


  # Functional Programming
  dartz: ^0.10.1

  # HTTP Client
  http: ^1.1.0
  dio: ^5.4.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Dependency Injection
  get_it: ^7.6.4

  # Connectivity
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Validation
  email_validator: ^2.1.17

  # Date & Time
  intl: ^0.18.1



  # UI Components & Animations
  flutter_spinkit: ^5.2.0
  lottie: ^2.7.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2

  # Utilities
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  #Flutter Launcher Icon
  flutter_launcher_icons: ^0.14.4

  # Code Generation (if needed for JSON serialization)
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets
  assets:
    - server/.env
    - assets/logo/

  # Custom Fonts for Beautiful Typography
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300

    # Optional: Add a second font for variety
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/habit_harbor_logo.png"
  min_sdk_android: 21